# pulsenet Configuration File | Sat Jul 18 21:58:12 GMT+07:00 2026

# Master toggle for the smart packet batching system. When true, outgoing packets are buffered and flushed in batches instead of individually.
batchingEnabled = true
# Batching mode: smart_execution (flush on tick + limits), strict_tick (flush only on tick end), interval (flush on a timer).
batchingMode = SMART_EXECUTION
# Maximum number of packets to buffer before forcing a flush.
batchingMaxBatchSize = 1024
# Maximum bytes to buffer before forcing a flush.
batchingMaxBatchBytes = 32000
# Interval in milliseconds for the INTERVAL batching mode.
batchingFlushInterval = 25
# Safety margin in bytes subtracted from the max batch bytes limit to prevent overflow.
batchingSafetyMarginBytes = 64
# List of packet class names that should flush the buffer immediately when sent.
batchingInstantPackets = ClientboundHurtAnimationPacket, ClientboundDamageEventPacket, ClientboundBlockEntityDataPacket
# List of packet class names that should always bypass the buffer entirely.
batchingIgnoredPackets = 
# List of plugin channel IDs whose custom payload packets should flush the buffer immediately when sent.
batchingInstantChannels = 
# List of plugin channel IDs whose custom payload packets should always bypass the buffer entirely.
batchingIgnoredChannels = 
# When true, chat-related packets bypass the buffer for instant delivery.
batchingChatPacketsBypass = true
# When true, packets sent from off the server thread bypass the buffer.
batchingOffThreadBypass = true
# When true, buffered packets are queued and written in a single event loop task instead of calling Connection.send() per packet, eliminating per-packet lambda allocations and cross-thread task scheduling.
batchingWriteQueue = true
# When true, packets in the coalesce list are bundled together into BundlePackets on flush, reducing the client's received packet count.
batchingPacketCoalescing = true
# List of packet class names to coalesce into BundlePackets (e.g. particles, sounds). Supports inner classes with dot syntax (Foo.Bar).
batchingCoalescePackets = ClientboundLevelParticlesPacket, ClientboundSoundPacket, ClientboundSoundEntityPacket
# Maximum number of sub-packets per BundlePacket. Vanilla client enforces a hard limit of 4096.
batchingCoalesceBundleLimit = 4000
# When true, block updates from explosions are grouped by chunk and replaced with full chunk resends if they exceed the threshold.
optExplosionsEnabled = true
# Number of block changes in a single chunk required to trigger a full chunk resend instead of individual updates.
optExplosionsBlockChangeThreshold = 512
# When true, logs a message each time the explosion optimization replaces block updates with a chunk resend.
optExplosionsLogOptimizations = false
# When true, the metrics collection system is active and computes network statistics.
metricsEnabled = true
# How often (in seconds) the metrics system recomputes derived statistics.
metricsUpdateInterval = 1
# Enables the network metrics module (PPS, bandwidth).
metricsModuleNetwork = true
# Enables the CPU metrics module (process CPU usage estimation).
metricsModuleCpu = true
# Enables the memory metrics module (saved allocation estimation).
metricsModuleMemory = true
# Enables the write queue metrics module (event loop task savings tracking).
metricsModuleWriteQueue = true
