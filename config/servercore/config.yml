# ServerCore Configuration
# Optimizations and performance tuning for Minecraft Fabric.

features:
  prevent-moving-into-unloaded-chunks: true
  autosave-interval-seconds: 600
  lobotomize-villagers:
    enabled: true
    tick-interval: 20

dynamic:
  # Enable dynamic performance adjustments based on MSPT
  enabled: true
  target-mspt: 35

  # Default starting values
  default-values:
    MOBCAP_PERCENTAGE: 100
    CHUNK_TICK_DISTANCE: 7
    VIEW_DISTANCE: 20
    SIMULATION_DISTANCE: 7

  # Settings that will be dynamically scaled down when server is overloaded
  settings:
    VIEW_DISTANCE:
      max: 20
      min: 10
      increment: 1
      interval: 15
    SIMULATION_DISTANCE:
      max: 7
      min: 5
      increment: 1
      interval: 20
    CHUNK_TICK_DISTANCE:
      max: 7
      min: 5
      increment: 1
      interval: 20
    MOBCAP_PERCENTAGE:
      max: 100
      min: 50
      increment: 10
      interval: 10
